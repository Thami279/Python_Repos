name: Weekly Neuroradiology Digest

on:
  schedule:
    # Every Monday at 06:00 UTC (08:00 SAST / 07:00 CAT)
    - cron: '0 6 * * 1'
  workflow_dispatch:
    inputs:
      days_back:
        description: 'Days of articles to look back (default 7)'
        required: false
        default: '7'

permissions:
  contents: write

jobs:
  generate-digest:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: neuroradiology_digest/requirements.txt

      - name: Install dependencies
        run: pip install -r neuroradiology_digest/requirements.txt

      - name: Generate digest
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          NCBI_EMAIL: ${{ secrets.NCBI_EMAIL || 'digest-bot@github-actions.local' }}
        run: python neuroradiology_digest/digest.py

      - name: Commit and push digest
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add digests/
          if git diff --staged --quiet; then
            echo "No new digest to commit."
          else
            git commit -m "chore: weekly neuroradiology digest $(date -u +%Y-%m-%d)"
            git push origin HEAD
          fi
